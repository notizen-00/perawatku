services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: medic-app:local
    container_name: medic-app
    environment:
      APP_ENV: production
      DOCKER_RUN_MIGRATIONS: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: medic_app
      DB_USERNAME: medic
      DB_PASSWORD: medic
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: medic-app
      REVERB_APP_KEY: medic-app-key
      REVERB_APP_SECRET: medic-app-secret
      REVERB_ALLOWED_ORIGINS: "*"
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - ./:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_node_modules:/var/www/html/node_modules
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: medic-nginx
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html:ro
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: medic-db
    environment:
      POSTGRES_DB: medic_app
      POSTGRES_USER: medic
      POSTGRES_PASSWORD: medic
    ports:
      - "54320:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: medic-redis
    ports:
      - "63791:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4
    container_name: medic-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    image: medic-app:local
    container_name: medic-reverb
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--debug"]
    environment:
      APP_ENV: local
      DOCKER_RUN_MIGRATIONS: "false"
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: medic-app
      REVERB_APP_KEY: medic-app-key
      REVERB_APP_SECRET: medic-app-secret
      REVERB_ALLOWED_ORIGINS: "*"
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: medic_app
      DB_USERNAME: medic
      DB_PASSWORD: medic
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_node_modules:/var/www/html/node_modules
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  node:
    image: node:20-alpine
    container_name: medic-node
    working_dir: /var/www/html
    entrypoint: ["sh", "/entrypoint.sh"]
    command: ["sh", "-lc", "npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      DOCKER_NODE_BUILD: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - app_node_modules:/var/www/html/node_modules
      - ./docker/node/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - app

volumes:
  app_vendor:
  app_node_modules:
  app_storage:
  db_data:
  redis_data:
