# Production stack for the perawatku monorepo.
#
# Brings up the Laravel backend (php-fpm + nginx + reverb), its database and
# cache, and the Nuxt admin dashboard as one unit. Meant to be copied to a
# VPS and run behind an existing host reverse proxy (e.g. Nginx Proxy
# Manager, Caddy, Traefik) that terminates TLS and forwards to the ports
# below -- it does not do TLS itself. See docs/deployment.md for the full
# walkthrough.
#
# Usage (from the repo root on the server):
#   cp deploy/.env.example deploy/.env                                  # fill in
#   cp apps/backend/.env.docker.prod.example apps/backend/.env          # fill in
#   cp apps/admin-dashboard/.env.example apps/admin-dashboard/.env      # fill in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build

name: perawatku

services:
  app:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.prod
    image: perawatku-backend:latest
    restart: unless-stopped
    env_file:
      - ../apps/backend/.env
    volumes:
      - backend_public:/var/www/html/public
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${BACKEND_HTTP_PORT:-8081}:80"
    volumes:
      - backend_public:/var/www/html/public:ro
      - backend_storage:/var/www/html/storage:ro
      - ../apps/backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_started

  reverb:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.prod
    image: perawatku-backend:latest
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - ../apps/backend/.env
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  admin:
    build:
      context: ../apps/admin-dashboard
      target: runner
    restart: unless-stopped
    ports:
      - "${ADMIN_HTTP_PORT:-3000}:3000"
    env_file:
      - ../apps/admin-dashboard/.env

  # Optional DB inspector. Off by default in production; start explicitly
  # with `docker compose -f deploy/docker-compose.prod.yml --profile tools up -d adminer`
  # and tear it down again when you're done.
  adminer:
    image: adminer:4
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  backend_public:
  backend_storage:
  db_data:
  redis_data:
